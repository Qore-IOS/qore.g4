<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Qore Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      İçerik Güvenlik Politikası BURADA DEĞİL, derleme sırasında yazılır.

      Sebep: politika kabuğa göre bir satır farklıdır (Electron `app://`,
      Capacitor `https://localhost`) ve iki kopya tutmak, birini güncelleyip
      diğerini unutmanın kestirme yoludur. Aşağıdaki işaretin yerine
      `vite.config.terminal.ts` içindeki `injectCsp()` eklentisi hedefe uygun
      tek politikayı koyar.
    -->
    <!-- qore:csp -->
    <!--
      Kökteki `dark` sınıfı yalnızca VARSAYILAN. Kayıtlı tercih varsa
      aşağıdaki `theme-boot.js` bunu ilk boyamadan önce düzeltir.
    -->
    <style>
      html,
      body {
        margin: 0;
      }
      /* Kayıtlı tercih okunana kadarki ilk kare. Koyu varsayılan olduğu için
         koyu zemin verilir; açık tercih eden makinelerde aşağıdaki betik bunu
         ilk boyamadan ÖNCE düzeltir. */
      html {
        background: #09090b;
      }
      html:not(.dark) {
        background: #efeae0;
      }
    </style>
    <!--
      Tema, React yüklenmeden uygulanır; aksi hâlde her açılışta kısa bir
      siyah/beyaz sıçrama olur. Ayrı dosya, çünkü CSP satır içi betiğe izin
      vermiyor (bkz. theme-boot.js).
    -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
