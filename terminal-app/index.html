<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Qore Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      İçerik Güvenlik Politikası.

      Paket `app://terminal` kaynağından sunulur ve kendi kodundan başka
      hiçbir betiği çalıştırmamalıdır: `script-src 'self'`. Bir CSP olmadan
      Electron uyarı basar ve daha önemlisi, gelecekte eklenecek bir üçüncü
      taraf betiği sessizce çalışabilir hâle gelirdi.

      `connect-src` yalnızca Firebase uç noktalarını içerir — terminalin ağa
      çıktığı tek yer orasıdır. `wss:` Firestore'un canlı dinleyicileri için
      gerekli.

      `style-src 'unsafe-inline'`: React ve Tailwind çalışma anında satır içi
      stil enjekte eder; bu olmadan arayüz stilsiz kalır.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self'
          https://*.googleapis.com
          https://*.firebaseio.com
          https://*.cloudfunctions.net
          wss://*.firebaseio.com
          wss://*.googleapis.com;
        frame-src 'none';
        object-src 'none';
        base-uri 'none';
      "
    />
    <!--
      Terminal karanlık temaya sabitlenmiştir: `class="dark"` kökte durur ve
      hiçbir yerde kaldırılmaz. Depo aydınlatmasında yüksek kontrast gerekir
      ve kullanıcının tema seçebileceği bir ekran yok.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #09090b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
