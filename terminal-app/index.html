<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Qore Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      İçerik Güvenlik Politikası.

      Paket `app://terminal` kaynağından sunulur ve kendi kodundan başka
      hiçbir betiği çalıştırmamalıdır: `script-src 'self'`. Bir CSP olmadan
      Electron uyarı basar ve daha önemlisi, gelecekte eklenecek bir üçüncü
      taraf betiği sessizce çalışabilir hâle gelirdi.

      `connect-src` yalnızca Firebase uç noktalarını içerir — terminalin ağa
      çıktığı tek yer orasıdır. `wss:` Firestore'un canlı dinleyicileri için
      gerekli.

      `style-src 'unsafe-inline'`: React ve Tailwind çalışma anında satır içi
      stil enjekte eder; bu olmadan arayüz stilsiz kalır.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self'
          https://*.googleapis.com
          https://*.firebaseio.com
          https://*.cloudfunctions.net
          wss://*.firebaseio.com
          wss://*.googleapis.com;
        frame-src 'none';
        object-src 'none';
        base-uri 'none';
      "
    />
    <!--
      Kökteki `dark` sınıfı yalnızca VARSAYILAN. Kayıtlı tercih varsa
      aşağıdaki `theme-boot.js` bunu ilk boyamadan önce düzeltir.
    -->
    <style>
      html,
      body {
        margin: 0;
      }
      /* Kayıtlı tercih okunana kadarki ilk kare. Koyu varsayılan olduğu için
         koyu zemin verilir; açık tercih eden makinelerde aşağıdaki betik bunu
         ilk boyamadan ÖNCE düzeltir. */
      html {
        background: #09090b;
      }
      html:not(.dark) {
        background: #efeae0;
      }
    </style>
    <!--
      Tema, React yüklenmeden uygulanır; aksi hâlde her açılışta kısa bir
      siyah/beyaz sıçrama olur. Ayrı dosya, çünkü CSP satır içi betiğe izin
      vermiyor (bkz. theme-boot.js).
    -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
