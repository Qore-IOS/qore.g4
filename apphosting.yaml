  # --- TAKVİM ENTEGRASYONU (Satın-Alma Planlama → Google Takvim / Outlook) ---
  # NOT: Değerler düz metin (value) olarak girildi; böylece Secret Manager +
  # grantaccess adımına gerek kalmadan deploy çalışır. GÜVENLİK: client secret
  # bu dosyada/depoda açık durur. Daha güvenli yöntem Secret Manager'dır
  # (bkz. aşağıdaki yorumlu alternatif). Secret'ın gizliliği önemliyse Google
  # Cloud'dan rotate edip Secret Manager'a geçmeniz önerilir.
  # Google Cloud OAuth kaydına eklenecek redirect URI:
  #   https://qorengine.com/api/calendar/google/callback
  - variable: GOOGLE_CALENDAR_CLIENT_ID
    value: "929852527053-kl2dvlrvvh54ulg0s6kgkf2h1raajlpj.apps.googleusercontent.com"
  - variable: GOOGLE_CALENDAR_CLIENT_SECRET
    value: "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"
  # Güvenli alternatif (Secret Manager kullanmak isterseniz yukarıdaki iki
  # 'value' satırını silip bunları açın; secret'ları oluşturup grantaccess verin):
  # - variable: GOOGLE_CALENDAR_CLIENT_ID
  #   secret: GOOGLE_CALENDAR_CLIENT_ID
  # - variable: GOOGLE_CALENDAR_CLIENT_SECRET
  #   secret: GOOGLE_CALENDAR_CLIENT_SECRET

  # Etkinliklerin saat dilimi (opsiyonel; varsayılan Europe/Istanbul):
  - variable: CALENDAR_TIMEZONE
    value: "Europe/Istanbul"

  # --- SONRA EKLENECEK (secret'ları oluşturunca yorumu kaldırın) ---
  # Microsoft Outlook:
  #   redirect URI: https://qorengine.com/api/calendar/microsoft/callback
  # - variable: MICROSOFT_CALENDAR_CLIENT_ID
  #   secret: MICROSOFT_CALENDAR_CLIENT_ID
  # - variable: MICROSOFT_CALENDAR_CLIENT_SECRET
  #   secret: MICROSOFT_CALENDAR_CLIENT_SECRET
  # Refresh token'ları AES-256-GCM ile şifrelemek için (önerilir):
  #   openssl rand -hex 32 | gcloud secrets create CALENDAR_TOKEN_SECRET --data-file=- --project=invpilot
  # - variable: CALENDAR_TOKEN_SECRET
