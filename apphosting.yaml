# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # En az 1 örnek her zaman SICAK kalsın → Cloud Run cold-start ortadan kalkar.
  # Sayfa açılışındaki ~7s'lik gecikmenin (statik JS/CSS chunk'larının TTFB'si)
  # asıl sebebi buydu: backend boştayken sıfıra iniyor, ilk istekte container
  # yeniden ayağa kalkıyor ve tüm istekleri ısınana kadar tutuyordu.
  minInstances: 1
  # Tek örnek tüm kullanıcıları + bir sayfada açılan ~40 eşzamanlı chunk
  # isteğini darboğaza sokuyordu. Yük altında yatay ölçeklenmeye izin ver.
  maxInstances: 10
# Set the startup timeout to 180 seconds to allow for longer build/start times.
startupTimeoutSeconds: 180

# --- Environment Variables ---
env:
  # --- SECRET KEY ---
  # This key is sensitive and is loaded from Secret Manager.
  # The "secret" value must match the name you created in Step 1.

  # --- PUBLIC KEYS ---
  # These NEXT_PUBLIC_ keys are safe to be public and are added directly.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCNyMrzGqqE6lswpxAXkNavCdWqOcXupwY"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "invpilot.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "invpilot"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "invpilot.appspot.com"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "929852527053"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:929852527053:web:bde59db5aae5c07a387484"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-TGHCKJKWEZ"
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: "BE2fqTvYpQ5glBOFR2MoPj0g5ZMd34V3isHYFGX5HjSBjhneZUavSbROEVVvNOpwKAQHYo3fFKzSHadfdq8zQ-o"
  - variable: NEXT_PUBLIC_FB_FUNCTION_REGION
    value: "europe-west1"
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: "AIzaSyDW59zZ7YY_z-Vg_M-FjZ4i1i7F-P0KQqQ"

  # --- TAKVİM ENTEGRASYONU (Satın-Alma Planlama → Google Takvim / Outlook) ---
  # Gizli değerler Secret Manager'dan yüklenir. Önce secret'ları oluşturun
  # (aksi hâlde deploy başarısız olur), sonra bu blok aktifleşir:
  #   printf "DEĞER" | gcloud secrets create GOOGLE_CALENDAR_CLIENT_ID     --data-file=- --project=invpilot
  #   printf "DEĞER" | gcloud secrets create GOOGLE_CALENDAR_CLIENT_SECRET --data-file=- --project=invpilot
  #   printf "DEĞER" | gcloud secrets create MICROSOFT_CALENDAR_CLIENT_ID     --data-file=- --project=invpilot
  #   printf "DEĞER" | gcloud secrets create MICROSOFT_CALENDAR_CLIENT_SECRET --data-file=- --project=invpilot
  #   openssl rand -hex 32 | gcloud secrets create CALENDAR_TOKEN_SECRET      --data-file=- --project=invpilot
  # Yönlendirme URI'leri (Google Cloud / Azure kaydına eklenmeli):
  #   https://<canlı-alan-adınız>/api/calendar/google/callback
  #   https://<canlı-alan-adınız>/api/calendar/microsoft/callback
  - variable: GOOGLE_CALENDAR_CLIENT_ID
    secret: GOOGLE_CALENDAR_CLIENT_ID
  - variable: GOOGLE_CALENDAR_CLIENT_SECRET
    secret: GOOGLE_CALENDAR_CLIENT_SECRET
  - variable: MICROSOFT_CALENDAR_CLIENT_ID
    secret: MICROSOFT_CALENDAR_CLIENT_ID
  - variable: MICROSOFT_CALENDAR_CLIENT_SECRET
    secret: MICROSOFT_CALENDAR_CLIENT_SECRET
  # Refresh token'ları AES-256-GCM ile şifrelemek için (önerilir):
  - variable: CALENDAR_TOKEN_SECRET
    secret: CALENDAR_TOKEN_SECRET
  # Etkinliklerin saat dilimi (opsiyonel; varsayılan Europe/Istanbul):
  - variable: CALENDAR_TIMEZONE
    value: "Europe/Istanbul"
