name: E2E

# NEDEN AYRI BİR İŞ AKIŞI
#
# Uçtan uca testler diğer kontrollerden farklı bir ortam ister: Java (Firestore
# emülatörü), bir tarayıcı ikilisi ve derlenmiş bir Next.js dev sunucusu. Bu
# maliyeti birim testlerin hızlı geri bildirimine yüklememek için ayrı tutulur.
#
# `continue-on-error` YOKTUR. Bu ağın işi yeniden yazım sırasında davranışın
# korunduğunu kanıtlamak; kırmızı geçilebilen bir emniyet ağı emniyet ağı
# değildir.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'firebase.e2e.json'
      - 'firestore.rules'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firestore emülatörü JVM üzerinde koşar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      # Yalnızca chromium: E2E'nin işi tarayıcı uyumluluğunu değil, iş akışının
      # bozulmadığını doğrulamak. Üç tarayıcı üç kat süre demek olurdu.
      - name: Tarayıcıyı kur
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Başarısız koşu artefaktları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
