name: Quality Gates

# Kalite raporu madde 2: PR'lar üç kapıdan geçmeden merge edilmemeli.
#
#   1. typecheck-gate — tip hatası RATCHET'i: hiçbir dosyanın hata sayısı
#      quality/typecheck-baseline.json'daki değeri aşamaz, temiz dosyaya
#      hata eklenemez. (next.config'deki ignoreBuildErrors:true yüzünden
#      üretime tanımsız-değişken bug'ları sızmıştı — bkz. PR #1458.)
#      Hata eritince ratchet'i sıkılaştırmak için:
#      node scripts/typecheck-gate.mjs --update
#   2. test — Node test runner paketi (486 test).
#   3. build — üretim build'i derlenebilmeli.
#
# Branch protection'da bu üç job'ı "required" yapmayı unutmayın:
# Settings → Branches → main → Require status checks.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-gate:
    name: Typecheck ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Sürüm package.json "packageManager" alanından okunur.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck gate (baseline ratchet)
        run: node scripts/typecheck-gate.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js production build
        # Placeholder Firebase env'leri: auth-context render'ında getAuth(app)
        # çağrıldığı için prerender, apiKey YOKKEN auth/invalid-api-key ile
        # patlar. Prerender ağ çağrısı yapmaz; init'in geçmesi yeterli —
        # gerçek secret GEREKMEZ. (App Hosting deploy'u kendi gerçek
        # env'leriyle ayrıca build alır.)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMY-ci-build-placeholder-000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:cidummy'
        run: pnpm build
