name: Firestore Rules Tests

# PR trigger'ı ARTIK AÇIK.
#
# Kapalı olma gerekçeleri ("lockfile'da @firebase/rules-unit-testing
# güncellenmemiş olabilir", "Java + firebase-tools setup'ı lazım") artık
# geçerli değil: paket `package.json` ve `pnpm-lock.yaml` içinde mevcut,
# job da zaten `setup-java` + `npm i -g firebase-tools` adımlarını içeriyor.
#
# Kapalı kalması gerçek bir maliyet üretiyordu: kural dosyasını değiştiren
# PR'larda hiçbir kontrol koşmuyordu. Kuralı unutulan bir koleksiyon
# üretimde sessizce reddedilir ve ancak kullanıcı şikâyetiyle fark edilir
# (bkz. docs/firestore-rules-rollout.md).
#
# Job `continue-on-error: true` olduğu için kırmızı sonuç merge'i BLOKLAMAZ;
# yalnızca görünürlük sağlar.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules.test.ts'
      - '.github/workflows/firestore-rules-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules.test.ts'
      - '.github/workflows/firestore-rules-tests.yml'

jobs:
  rules:
    name: Run @firebase/rules-unit-testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hata PR'ı blocklamasın — emulator/lockfile sorunları sırasında bile
    # diğer kontrollerin çalışmasına izin ver.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        # --no-frozen-lockfile: lockfile güncelliği zorunlu değil (CI smoke
        # testi); production deploy için ayrı job'da --frozen olmalı.
        run: pnpm install --no-frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run rules tests (with emulator)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: pnpm test:rules:emulated
