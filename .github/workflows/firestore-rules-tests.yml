name: Firestore Rules Tests

# Manuel tetikleme + opt-in PR label.
# Otomatik PR trigger'ı kapalı çünkü:
#   - pnpm-lock.yaml içinde @firebase/rules-unit-testing güncellenmemiş
#     olabilir; lockfile güncellenince trigger'a "pull_request" eklenebilir.
#   - Firestore emulator için Java + firebase-tools gerekiyor; runner'da
#     ek setup adımları lazım.
#
# Kurulum hazır olduktan sonra `on.pull_request` bloğunu açıp `paths`
# filter ile geri etkin et.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules.test.ts'
      - '.github/workflows/firestore-rules-tests.yml'

jobs:
  rules:
    name: Run @firebase/rules-unit-testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hata PR'ı blocklamasın — emulator/lockfile sorunları sırasında bile
    # diğer kontrollerin çalışmasına izin ver.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        # --no-frozen-lockfile: lockfile güncelliği zorunlu değil (CI smoke
        # testi); production deploy için ayrı job'da --frozen olmalı.
        run: pnpm install --no-frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run rules tests (with emulator)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: pnpm test:rules:emulated
